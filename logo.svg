    <polygon points="36,44 48,44 60,12 48,12" fill="url(#g)" opacity="0.5"/>
  </g>
  <text x="72" y="33" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" fill="#0b2545" letter-spacing="1">AZA</text>
  <text x="138" y="33" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="300" fill="#1e5bff" letter-spacing="1">Federal</text>
  <text x="73" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#5b6b82" letter-spacing="3">SYSTEMS INTEGRATION</text>
</svg>
